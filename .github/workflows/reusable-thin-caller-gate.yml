name: reusable-thin-caller-gate

# Thin-caller size gate for consumer repos (issue #546, follow-up to #411).
#
# The provider (projectbluefin/actions) has no active caller workflows, so the
# gate runs vacuously there. Consumer repos call this reusable from their own
# PR checks so a caller workflow that delegates to projectbluefin/actions and
# grows past the 50-line threshold fails *before* it reaches that repo's main,
# instead of only being caught by the weekly factory-drift backstop.
#
# Single source of truth: the reusable re-checks-out projectbluefin/actions@v1
# to run the canonical scripts/validate_thin_caller.py, so every consumer
# enforces the same rule. Opt in from a consumer PR workflow by adding a job
# that calls this reusable at @v1.

on:
  workflow_call:

permissions: {}

jobs:
  thin-caller-gate:
    name: Thin-caller size gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout thin-caller gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projectbluefin/actions
          ref: v1
          path: thin-caller-gate

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run thin-caller size gate
        run: python3 thin-caller-gate/scripts/validate_thin_caller.py --max-lines 50 --root .
